<!DOCTYPE html>
<html lang="en">
<head>
    <title>Daylight Comparison for Boston</title>
    <link rel="stylesheet" href="styles.css" type="text/css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    <h1>Daylight Comparison for Boston</h1>
    
    <div class="card">
        <h2>Today (August 17, 2026)</h2>
        <div class="data-row">
            <span>Sunrise</span>
            <span>5:53:25 AM</span>
        </div>
        <div class="data-row">
            <span>Sunset</span>
            <span>7:42:25 PM</span>
        </div>
        <div class="data-row">
            <span>Day Length</span>
            <span>13:48:59</span>
        </div>
    </div>
    
    <div class="card ">
        <h2>Similar Day</h2>
        
        <div class="data-row">
            <span>Date</span>
            <span>April 25, 2026</span>
        </div>
        <div class="data-row">
            <span>Sunrise</span>
            <span>5:47:38 AM</span>
        </div>
        <div class="data-row">
            <span>Sunset</span>
            <span>7:37:27 PM</span>
        </div>
        <div class="data-row">
            <span>Day Length</span>
            <span>13:49:49</span>
        </div>
        
    </div>
</body>
</html>
