<!DOCTYPE html>
<html lang="en">
<head>
    <title>Daylight Comparison for Boston</title>
    <link rel="stylesheet" href="styles.css" type="text/css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    <h1>Daylight Comparison for Boston</h1>
    
    <div class="card">
        <h2>Today (July 24, 2026)</h2>
        <div class="data-row">
            <span>Sunrise</span>
            <span>5:28:44 AM</span>
        </div>
        <div class="data-row">
            <span>Sunset</span>
            <span>8:12:16 PM</span>
        </div>
        <div class="data-row">
            <span>Day Length</span>
            <span>14:43:32</span>
        </div>
    </div>
    
    <div class="card ">
        <h2>Similar Day</h2>
        
        <div class="data-row">
            <span>Date</span>
            <span>April 25, 2026</span>
        </div>
        <div class="data-row">
            <span>Sunrise</span>
            <span>5:47:38 AM</span>
        </div>
        <div class="data-row">
            <span>Sunset</span>
            <span>7:37:27 PM</span>
        </div>
        <div class="data-row">
            <span>Day Length</span>
            <span>13:49:49</span>
        </div>
        
    </div>
</body>
</html>
