<!DOCTYPE html>
<html lang="en">
<head>
    <title>Daylight Comparison for Boston</title>
    <link rel="stylesheet" href="styles.css" type="text/css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    <h1>Daylight Comparison for Boston</h1>
    
    <div class="card">
        <h2>Today (August 28, 2026)</h2>
        <div class="data-row">
            <span>Sunrise</span>
            <span>6:05:05 AM</span>
        </div>
        <div class="data-row">
            <span>Sunset</span>
            <span>7:25:01 PM</span>
        </div>
        <div class="data-row">
            <span>Day Length</span>
            <span>13:19:55</span>
        </div>
    </div>
    
    <div class="card ">
        <h2>Similar Day</h2>
        
        <div class="data-row">
            <span>Date</span>
            <span>April 14, 2026</span>
        </div>
        <div class="data-row">
            <span>Sunrise</span>
            <span>6:04:39 AM</span>
        </div>
        <div class="data-row">
            <span>Sunset</span>
            <span>7:25:03 PM</span>
        </div>
        <div class="data-row">
            <span>Day Length</span>
            <span>13:20:23</span>
        </div>
        
    </div>
</body>
</html>
