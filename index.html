<!DOCTYPE html>
<html lang="en">
<head>
    <title>Daylight Comparison for Boston</title>
    <link rel="stylesheet" href="styles.css" type="text/css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    <h1>Daylight Comparison for Boston</h1>
    
    <div class="card">
        <h2>Today (November 21, 2026)</h2>
        <div class="data-row">
            <span>Sunrise</span>
            <span>6:42:14 AM</span>
        </div>
        <div class="data-row">
            <span>Sunset</span>
            <span>4:17:41 PM</span>
        </div>
        <div class="data-row">
            <span>Day Length</span>
            <span>9:35:27</span>
        </div>
    </div>
    
    <div class="card ">
        <h2>Similar Day</h2>
        
        <div class="data-row">
            <span>Date</span>
            <span>February 24, 2026</span>
        </div>
        <div class="data-row">
            <span>Sunrise</span>
            <span>6:27:11 AM</span>
        </div>
        <div class="data-row">
            <span>Sunset</span>
            <span>5:28:13 PM</span>
        </div>
        <div class="data-row">
            <span>Day Length</span>

    </div>
</body>
</html>
