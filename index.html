<!DOCTYPE html>
<html lang="en">
<head>
    <title>Daylight Comparison for Boston</title>
    <link rel="stylesheet" href="styles.css" type="text/css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    <h1>Daylight Comparison for Boston</h1>
    
    <div class="card">
        <h2>Today (October 18, 2026)</h2>
        <div class="data-row">
            <span>Sunrise</span>
            <span>7:00:29 AM</span>
        </div>
        <div class="data-row">
            <span>Sunset</span>
            <span>5:57:36 PM</span>
        </div>
        <div class="data-row">
            <span>Day Length</span>
            <span>10:57:07</span>
        </div>
    </div>
    
    <div class="card ">
        <h2>Similar Day</h2>
        
        <div class="data-row">
            <span>Date</span>
            <span>February 23, 2026</span>
        </div>
        <div class="data-row">
            <span>Sunrise</span>
            <span>6:28:43 AM</span>
        </div>
        <div class="data-row">
            <span>Sunset</span>
            <span>5:26:58 PM</span>
        </div>
        <div class="data-row">
            <span>Day Length</span>
            <span>10:58:14</span>
        </div>
        
    </div>
</body>
</html>
