<!DOCTYPE html>
<html lang="en">
<head>
    <title>Daylight Comparison for Boston</title>
    <link rel="stylesheet" href="styles.css" type="text/css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    <h1>Daylight Comparison for Boston</h1>
    
    <div class="card">
        <h2>Today (September 14, 2026)</h2>
        <div class="data-row">
            <span>Sunrise</span>
            <span>6:22:59 AM</span>
        </div>
        <div class="data-row">
            <span>Sunset</span>
            <span>6:55:44 PM</span>
        </div>
        <div class="data-row">
            <span>Day Length</span>
            <span>12:32:45</span>
        </div>
    </div>
    
    <div class="card ">
        <h2>Similar Day</h2>
        
        <div class="data-row">
            <span>Date</span>
            <span>March 28, 2026</span>
        </div>
        <div class="data-row">
            <span>Sunrise</span>
            <span>6:33:21 AM</span>
        </div>
        <div class="data-row">
            <span>Sunset</span>
            <span>7:05:52 PM</span>
        </div>
        <div class="data-row">
            <span>Day Length</span>

        </div>
        
    </div>
</body>
</html>
