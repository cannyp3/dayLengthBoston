<!DOCTYPE html>
<html lang="en">
<head>
    <title>Daylight Comparison for Boston</title>
    <link rel="stylesheet" href="styles.css" type="text/css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    <h1>Daylight Comparison for Boston</h1>
    
    <div class="card">
        <h2>Today (September 04, 2026)</h2>
        <div class="data-row">
            <span>Sunrise</span>
            <span>6:12:28 AM</span>
        </div>
        <div class="data-row">
            <span>Sunset</span>
            <span>7:13:12 PM</span>
        </div>
        <div class="data-row">
            <span>Day Length</span>
            <span>13:00:44</span>
        </div>
    </div>
    
    <div class="card ">
        <h2>Similar Day</h2>
        
        <div class="data-row">
            <span>Date</span>
            <span>April 07, 2026</span>
        </div>
        <div class="data-row">
            <span>Sunrise</span>
            <span>6:16:13 AM</span>
        </div>
        <div class="data-row">
            <span>Sunset</span>
            <span>7:17:09 PM</span>
        </div>
        <div class="data-row">
            <span>Day Length</span>
            <span>13:00:55</span>
        </div>
        
    </div>
</body>
</html>
