<!DOCTYPE html>
<html lang="en">
<head>
    <title>Daylight Comparison for Boston</title>
    <link rel="stylesheet" href="styles.css" type="text/css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    <h1>Daylight Comparison for Boston</h1>
    
    <div class="card">
        <h2>Today (October 23, 2026)</h2>
        <div class="data-row">
            <span>Sunrise</span>
            <span>7:06:26 AM</span>
        </div>
        <div class="data-row">
            <span>Sunset</span>
            <span>5:50:02 PM</span>
        </div>
        <div class="data-row">
            <span>Day Length</span>
            <span>10:43:36</span>
        </div>
    </div>
    
    <div class="card ">
        <h2>Similar Day</h2>
        
        <div class="data-row">
            <span>Date</span>
            <span>February 18, 2026</span>
        </div>
        <div class="data-row">
            <span>Sunrise</span>
            <span>6:36:09 AM</span>
        </div>
        <div class="data-row">
            <span>Sunset</span>
            <span>5:20:40 PM</span>
        </div>
        <div class="data-row">
            <span>Day Length</span>
            <span>10:44:31</span>
        </div>
        
    </div>
</body>
</html>
