<!DOCTYPE html>
<html lang="en">
<head>
    <title>Daylight Comparison for Boston</title>
    <link rel="stylesheet" href="styles.css" type="text/css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    <h1>Daylight Comparison for Boston</h1>
    
    <div class="card">
        <h2>Today (November 01, 2026)</h2>
        <div class="data-row">
            <span>Sunrise</span>
            <span>6:17:27 AM</span>
        </div>
        <div class="data-row">
            <span>Sunset</span>
            <span>4:37:38 PM</span>
        </div>
        <div class="data-row">
            <span>Day Length</span>
            <span>10:20:11</span>
        </div>
    </div>
    
    <div class="card ">
        <h2>Similar Day</h2>
        
        <div class="data-row">
            <span>Date</span>
            <span>February 09, 2026</span>
        </div>
        <div class="data-row">
            <span>Sunrise</span>
            <span>6:48:19 AM</span>
        </div>
        <div class="data-row">
            <span>Sunset</span>
            <span>5:09:05 PM</span>
        </div>
        <div class="data-row">
            <span>Day Length</span>
            <span>10:20:45</span>
        </div>
        
    </div>
</body>
</html>
