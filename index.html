<!DOCTYPE html>
<html lang="en">
<head>
    <title>Daylight Comparison for Boston</title>
    <link rel="stylesheet" href="styles.css" type="text/css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    <h1>Daylight Comparison for Boston</h1>
    
    <div class="card">
        <h2>Today (October 26, 2026)</h2>
        <div class="data-row">
            <span>Sunrise</span>
            <span>7:10:04 AM</span>
        </div>
        <div class="data-row">
            <span>Sunset</span>
            <span>5:45:43 PM</span>
        </div>
        <div class="data-row">
            <span>Day Length</span>
            <span>10:35:38</span>
        </div>
    </div>
    
    <div class="card ">
        <h2>Similar Day</h2>
        
        <div class="data-row">
            <span>Date</span>
            <span>February 15, 2026</span>
        </div>
        <div class="data-row">
            <span>Sunrise</span>
            <span>6:40:23 AM</span>
        </div>
        <div class="data-row">
            <span>Sunset</span>
            <span>5:16:50 PM</span>
        </div>
        <div class="data-row">
            <span>Day Length</span>
            <span>10:36:26</span>
        </div>
        
    </div>
</body>
</html>
