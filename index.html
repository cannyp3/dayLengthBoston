<!DOCTYPE html>
<html lang="en">
<head>
    <title>Daylight Comparison for Boston</title>
    <link rel="stylesheet" href="styles.css" type="text/css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    <h1>Daylight Comparison for Boston</h1>
    
    <div class="card">
        <h2>Today (September 28, 2026)</h2>
        <div class="data-row">
            <span>Sunrise</span>
            <span>6:37:56 AM</span>
        </div>
        <div class="data-row">
            <span>Sunset</span>
            <span>6:31:00 PM</span>
        </div>
        <div class="data-row">
            <span>Day Length</span>
            <span>11:53:04</span>
        </div>
    </div>
    
    <div class="card ">
        <h2>Similar Day</h2>
        
        <div class="data-row">
            <span>Date</span>
            <span>March 14, 2026</span>
        </div>
        <div class="data-row">
            <span>Sunrise</span>
            <span>6:57:36 AM</span>
        </div>
        <div class="data-row">
            <span>Sunset</span>
            <span>6:49:50 PM</span>
        </div>
        <div class="data-row">
            <span>Day Length</span>
            <span>11:52:13</span>
        </div>
        
    </div>
</body>
</html>
