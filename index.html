<!DOCTYPE html>
<html lang="en">
<head>
    <title>Daylight Comparison for Boston</title>
    <link rel="stylesheet" href="styles.css" type="text/css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    <h1>Daylight Comparison for Boston</h1>
    
    <div class="card">
        <h2>Today (September 05, 2026)</h2>
        <div class="data-row">
            <span>Sunrise</span>
            <span>6:13:31 AM</span>
        </div>
        <div class="data-row">
            <span>Sunset</span>
            <span>7:11:29 PM</span>
        </div>
        <div class="data-row">
            <span>Day Length</span>
            <span>12:57:57</span>
        </div>
    </div>
    
    <div class="card ">

        </div>
        <div class="data-row">
            <span>Sunset</span>

    </div>
</body>
</html>
