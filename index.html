<!DOCTYPE html>
<html lang="en">
<head>
    <title>Daylight Comparison for Boston</title>
    <link rel="stylesheet" href="styles.css" type="text/css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    <h1>Daylight Comparison for Boston</h1>
    
    <div class="card">
        <h2>Today (September 19, 2026)</h2>
        <div class="data-row">
            <span>Sunrise</span>
            <span>6:28:17 AM</span>
        </div>
        <div class="data-row">
            <span>Sunset</span>
            <span>6:46:53 PM</span>
        </div>
        <div class="data-row">
            <span>Day Length</span>
            <span>12:18:36</span>
        </div>
    </div>
    
    <div class="card ">
        <h2>Similar Day</h2>
        
        <div class="data-row">

        </div>

</body>
</html>
