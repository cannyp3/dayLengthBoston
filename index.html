<!DOCTYPE html>
<html lang="en">
<head>
    <title>Daylight Comparison for Boston</title>
    <link rel="stylesheet" href="styles.css" type="text/css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    <h1>Daylight Comparison for Boston</h1>
    
    <div class="card">
        <h2>Today (September 22, 2026)</h2>
        <div class="data-row">
            <span>Sunrise</span>
            <span>6:31:28 AM</span>
        </div>
        <div class="data-row">
            <span>Sunset</span>
            <span>6:41:35 PM</span>
        </div>
        <div class="data-row">
            <span>Day Length</span>
            <span>12:10:06</span>
        </div>
    </div>
    
    <div class="card ">
        <h2>Similar Day</h2>
        
        <div class="data-row">
            <span>Date</span>
            <span>March 20, 2026</span>
        </div>
        <div class="data-row">
            <span>Sunrise</span>
            <span>6:47:15 AM</span>
        </div>
        <div class="data-row">
            <span>Sunset</span>
            <span>6:56:45 PM</span>
        </div>
        <div class="data-row">
            <span>Day Length</span>
            <span>12:09:30</span>
        </div>
        
    </div>
</body>
</html>
