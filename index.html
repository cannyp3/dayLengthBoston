<!DOCTYPE html>
<html lang="en">
<head>
    <title>Daylight Comparison for Boston</title>
    <link rel="stylesheet" href="styles.css" type="text/css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    <h1>Daylight Comparison for Boston</h1>
    
    <div class="card">
        <h2>Today (October 16, 2026)</h2>
        <div class="data-row">
            <span>Sunrise</span>
            <span>6:58:08 AM</span>
        </div>
        <div class="data-row">
            <span>Sunset</span>
            <span>6:00:44 PM</span>
        </div>
        <div class="data-row">
            <span>Day Length</span>
            <span>11:02:36</span>
        </div>
    </div>
    
    <div class="card ">
        <h2>Similar Day</h2>
        
        <div class="data-row">
            <span>Date</span>
            <span>February 25, 2026</span>
        </div>
        <div class="data-row">
            <span>Sunrise</span>
            <span>6:25:38 AM</span>
        </div>
        <div class="data-row">
            <span>Sunset</span>
            <span>5:29:27 PM</span>
        </div>
        <div class="data-row">
            <span>Day Length</span>
            <span>11:03:49</span>
        </div>
        
    </div>
</body>
</html>
