<!DOCTYPE html>
<html lang="en">
<head>
    <title>Daylight Comparison for Boston</title>
    <link rel="stylesheet" href="styles.css" type="text/css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    <h1>Daylight Comparison for Boston</h1>
    
    <div class="card">
        <h2>Today (August 11, 2026)</h2>
        <div class="data-row">
            <span>Sunrise</span>
            <span>5:47:04 AM</span>
        </div>
        <div class="data-row">
            <span>Sunset</span>
            <span>7:51:05 PM</span>
        </div>
        <div class="data-row">
            <span>Day Length</span>
            <span>14:04:01</span>
        </div>
    </div>
    
    <div class="card ">
        <h2>Similar Day</h2>
        
        <div class="data-row">
            <span>Date</span>
            <span>May 01, 2026</span>
        </div>
        <div class="data-row">
            <span>Sunrise</span>
            <span>5:39:11 AM</span>
        </div>
        <div class="data-row">
            <span>Sunset</span>
            <span>7:44:10 PM</span>
        </div>
        <div class="data-row">
            <span>Day Length</span>
            <span>14:04:59</span>
        </div>
        
    </div>
</body>
</html>
