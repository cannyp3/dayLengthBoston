<!DOCTYPE html>
<html lang="en">
<head>
    <title>Daylight Comparison for Boston</title>
    <link rel="stylesheet" href="styles.css" type="text/css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    <h1>Daylight Comparison for Boston</h1>
    
    <div class="card">
        <h2>Today (October 31, 2026)</h2>
        <div class="data-row">
            <span>Sunrise</span>
            <span>7:16:13 AM</span>
        </div>
        <div class="data-row">
            <span>Sunset</span>
            <span>5:38:56 PM</span>
        </div>
        <div class="data-row">
            <span>Day Length</span>
            <span>10:22:43</span>
        </div>
    </div>
    
    <div class="card ">
        <h2>Similar Day</h2>
        
        <div class="data-row">
            <span>Date</span>
            <span>February 10, 2026</span>
        </div>
        <div class="data-row">
            <span>Sunrise</span>
            <span>6:47:03 AM</span>
        </div>
        <div class="data-row">
            <span>Sunset</span>
            <span>5:10:23 PM</span>
        </div>
        <div class="data-row">
            <span>Day Length</span>
            <span>10:23:19</span>
        </div>
        
    </div>
</body>
</html>
