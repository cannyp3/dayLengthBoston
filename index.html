<!DOCTYPE html>
<html lang="en">
<head>
    <title>Daylight Comparison for Boston</title>
    <link rel="stylesheet" href="styles.css" type="text/css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    <h1>Daylight Comparison for Boston</h1>
    
    <div class="card">
        <h2>Today (August 12, 2026)</h2>
        <div class="data-row">
            <span>Sunrise</span>
            <span>5:48:07 AM</span>
        </div>
        <div class="data-row">
            <span>Sunset</span>
            <span>7:49:41 PM</span>
        </div>
        <div class="data-row">
            <span>Day Length</span>
            <span>14:01:34</span>
        </div>
    </div>
    
    <div class="card ">
        <h2>Similar Day</h2>
        
        <div class="data-row">
            <span>Date</span>
            <span>April 30, 2026</span>
        </div>
        <div class="data-row">
            <span>Sunrise</span>
            <span>5:40:33 AM</span>
        </div>
        <div class="data-row">
            <span>Sunset</span>
            <span>7:43:04 PM</span>
        </div>
        <div class="data-row">
            <span>Day Length</span>
            <span>14:02:30</span>
        </div>
        
    </div>
</body>
</html>
