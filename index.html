<!DOCTYPE html>
<html lang="en">
<head>
    <title>Daylight Comparison for Boston</title>
    <link rel="stylesheet" href="styles.css" type="text/css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    <h1>Daylight Comparison for Boston</h1>
    
    <div class="card">
        <h2>Today (September 10, 2026)</h2>
        <div class="data-row">
            <span>Sunrise</span>
            <span>6:18:47 AM</span>
        </div>
        <div class="data-row">
            <span>Sunset</span>
            <span>7:02:47 PM</span>
        </div>
        <div class="data-row">
            <span>Day Length</span>
            <span>12:44:00</span>
        </div>
    </div>
    
    <div class="card ">
        <h2>Similar Day</h2>
        
        <div class="data-row">
            <span>Date</span>
            <span>April 01, 2026</span>
        </div>
        <div class="data-row">
            <span>Sunrise</span>
            <span>6:26:26 AM</span>
        </div>
        <div class="data-row">
            <span>Sunset</span>
            <span>7:10:23 PM</span>
        </div>
        <div class="data-row">
            <span>Day Length</span>
            <span>12:43:56</span>
        </div>
        
    </div>
</body>
</html>
