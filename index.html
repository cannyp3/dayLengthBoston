<!DOCTYPE html>
<html lang="en">
<head>
    <title>Daylight Comparison for Boston</title>
    <link rel="stylesheet" href="styles.css" type="text/css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    <h1>Daylight Comparison for Boston</h1>
    
    <div class="card">
        <h2>Today (November 09, 2026)</h2>
        <div class="data-row">
            <span>Sunrise</span>
            <span>6:27:26 AM</span>
        </div>
        <div class="data-row">
            <span>Sunset</span>
            <span>4:28:14 PM</span>
        </div>
        <div class="data-row">
            <span>Day Length</span>
            <span>10:00:47</span>
        </div>
    </div>
    
    <div class="card ">
        <h2>Similar Day</h2>
        
        <div class="data-row">
            <span>Date</span>
            <span>February 12, 2026</span>
        </div>

            <span>Sunrise</span>
            <span>6:44:27 AM</span>
        </div>
        <div class="data-row">
            <span>Sunset</span>
            <span>5:12:58 PM</span>
        </div>

    </div>
</body>
</html>
