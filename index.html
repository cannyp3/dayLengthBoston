<!DOCTYPE html>
<html lang="en">
<head>
    <title>Daylight Comparison for Boston</title>
    <link rel="stylesheet" href="styles.css" type="text/css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    <h1>Daylight Comparison for Boston</h1>
    
    <div class="card">
        <h2>Today (November 03, 2026)</h2>
        <div class="data-row">
            <span>Sunrise</span>
            <span>6:19:56 AM</span>
        </div>
        <div class="data-row">
            <span>Sunset</span>
            <span>4:35:08 PM</span>
        </div>
        <div class="data-row">
            <span>Day Length</span>
            <span>10:15:11</span>
        </div>
    </div>
    
    <div class="card ">

        </div>

</body>
</html>
