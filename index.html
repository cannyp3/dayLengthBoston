<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    <h1>Daylight Comparison for Boston</h1>
    
    <div class="card">
        <h2>Today (November 17, 2026)</h2>

            <span>Sunrise</span>
            <span>6:37:23 AM</span>
        </div>
        <div class="data-row">
            <span>Sunset</span>

        </div>
        <div class="data-row">

    </div>

</html>
