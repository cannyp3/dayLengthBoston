<!DOCTYPE html>
<html lang="en">
<head>
    <title>Daylight Comparison for Boston</title>
    <link rel="stylesheet" href="styles.css" type="text/css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    <h1>Daylight Comparison for Boston</h1>
    
    <div class="card">
        <h2>Today (October 28, 2026)</h2>
        <div class="data-row">
            <span>Sunrise</span>
            <span>7:12:31 AM</span>
        </div>
        <div class="data-row">
            <span>Sunset</span>
            <span>5:42:56 PM</span>
        </div>
        <div class="data-row">
            <span>Day Length</span>
            <span>10:30:25</span>
        </div>
    </div>
    
    <div class="card ">
        <h2>Similar Day</h2>
        
        <div class="data-row">
            <span>Date</span>
            <span>February 13, 2026</span>
        </div>
        <div class="data-row">
            <span>Sunrise</span>
            <span>6:43:07 AM</span>
        </div>
        <div class="data-row">
            <span>Sunset</span>
            <span>5:14:16 PM</span>
        </div>
        <div class="data-row">
            <span>Day Length</span>
            <span>10:31:08</span>
        </div>
        
    </div>
</body>
</html>
