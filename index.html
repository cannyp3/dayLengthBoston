<!DOCTYPE html>
<html lang="en">
<head>
    <title>Daylight Comparison for Boston</title>
    <link rel="stylesheet" href="styles.css" type="text/css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    <h1>Daylight Comparison for Boston</h1>
    
    <div class="card">
        <h2>Today (September 26, 2026)</h2>
        <div class="data-row">
            <span>Sunrise</span>
            <span>6:35:46 AM</span>
        </div>
        <div class="data-row">
            <span>Sunset</span>
            <span>6:34:31 PM</span>
        </div>
        <div class="data-row">
            <span>Day Length</span>
            <span>11:58:45</span>
        </div>
    </div>
    
    <div class="card ">
        <h2>Similar Day</h2>
        
        <div class="data-row">
            <span>Date</span>
            <span>March 16, 2026</span>
        </div>

            <span>Sunrise</span>
            <span>6:54:10 AM</span>
        </div>
        <div class="data-row">
            <span>Sunset</span>
            <span>6:52:09 PM</span>
        </div>
        <div class="data-row">
            <span>Day Length</span>

        </div>
        
    </div>
</body>
</html>
