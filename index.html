<!DOCTYPE html>
<html lang="en">
<head>
    <title>Daylight Comparison for Boston</title>
    <link rel="stylesheet" href="styles.css" type="text/css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    <h1>Daylight Comparison for Boston</h1>
    
    <div class="card">
        <h2>Today (July 25, 2026)</h2>
        <div class="data-row">
            <span>Sunrise</span>
            <span>5:29:42 AM</span>
        </div>
        <div class="data-row">
            <span>Sunset</span>
            <span>8:11:19 PM</span>
        </div>
        <div class="data-row">
            <span>Day Length</span>
            <span>14:41:37</span>
        </div>
    </div>
    
    <div class="card ">
        <h2>Similar Day</h2>
        
        <div class="data-row">
            <span>Date</span>
            <span>April 26, 2026</span>
        </div>
        <div class="data-row">
            <span>Sunrise</span>
            <span>5:46:11 AM</span>
        </div>
        <div class="data-row">
            <span>Sunset</span>
            <span>7:38:35 PM</span>
        </div>
        <div class="data-row">
            <span>Day Length</span>
            <span>13:52:23</span>
        </div>
        
    </div>
</body>
</html>
