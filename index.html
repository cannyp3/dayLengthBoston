<!DOCTYPE html>
<html lang="en">
<head>
    <title>Daylight Comparison for Boston</title>
    <link rel="stylesheet" href="styles.css" type="text/css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    <h1>Daylight Comparison for Boston</h1>
    
    <div class="card">
        <h2>Today (September 15, 2026)</h2>
        <div class="data-row">
            <span>Sunrise</span>
            <span>6:24:03 AM</span>
        </div>
        <div class="data-row">
            <span>Sunset</span>
            <span>6:53:58 PM</span>
        </div>
        <div class="data-row">
            <span>Day Length</span>
            <span>12:29:55</span>
        </div>
    </div>
    
    <div class="card ">
        <h2>Similar Day</h2>
        
        <div class="data-row">
            <span>Date</span>
            <span>March 27, 2026</span>
        </div>

            <span>Sunrise</span>
            <span>6:35:05 AM</span>
        </div>
        <div class="data-row">
            <span>Sunset</span>
            <span>7:04:44 PM</span>
        </div>
        <div class="data-row">
            <span>Day Length</span>

    </div>
</body>
</html>
