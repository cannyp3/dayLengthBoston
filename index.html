<!DOCTYPE html>
<html lang="en">
<head>
    <title>Daylight Comparison for Boston</title>
    <link rel="stylesheet" href="styles.css" type="text/css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    <h1>Daylight Comparison for Boston</h1>
    
    <div class="card">
        <h2>Today (October 19, 2026)</h2>
        <div class="data-row">
            <span>Sunrise</span>
            <span>7:01:40 AM</span>
        </div>
        <div class="data-row">
            <span>Sunset</span>
            <span>5:56:03 PM</span>
        </div>
        <div class="data-row">
            <span>Day Length</span>
            <span>10:54:23</span>
        </div>
    </div>
    
    <div class="card ">
        <h2>Similar Day</h2>
        
        <div class="data-row">
            <span>Date</span>
            <span>February 22, 2026</span>
        </div>
        <div class="data-row">
            <span>Sunrise</span>
            <span>6:30:14 AM</span>
        </div>
        <div class="data-row">
            <span>Sunset</span>
            <span>5:25:43 PM</span>
        </div>
        <div class="data-row">
            <span>Day Length</span>
            <span>10:55:28</span>
        </div>
        
    </div>
</body>
</html>
