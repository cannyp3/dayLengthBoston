<!DOCTYPE html>
<html lang="en">
<head>
    <title>Daylight Comparison for Boston</title>
    <link rel="stylesheet" href="styles.css" type="text/css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    <h1>Daylight Comparison for Boston</h1>
    
    <div class="card">
        <h2>Today (August 05, 2026)</h2>
        <div class="data-row">
            <span>Sunrise</span>
            <span>5:40:46 AM</span>
        </div>
        <div class="data-row">
            <span>Sunset</span>
            <span>7:59:02 PM</span>
        </div>
        <div class="data-row">
            <span>Day Length</span>
            <span>14:18:15</span>
        </div>
    </div>
    
    <div class="card ">
        <h2>Similar Day</h2>
        
        <div class="data-row">
            <span>Date</span>
            <span>May 07, 2026</span>
        </div>
        <div class="data-row">
            <span>Sunrise</span>
            <span>5:31:28 AM</span>
        </div>
        <div class="data-row">
            <span>Sunset</span>
            <span>7:50:48 PM</span>
        </div>
        <div class="data-row">
            <span>Day Length</span>
            <span>14:19:19</span>
        </div>
        
    </div>
</body>
</html>
