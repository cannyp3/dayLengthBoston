<!DOCTYPE html>
<html lang="en">
<head>
    <title>Daylight Comparison for Boston</title>
    <link rel="stylesheet" href="styles.css" type="text/css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    <h1>Daylight Comparison for Boston</h1>
    
    <div class="card">
        <h2>Today (July 27, 2026)</h2>
        <div class="data-row">
            <span>Sunrise</span>
            <span>5:31:39 AM</span>
        </div>
        <div class="data-row">
            <span>Sunset</span>
            <span>8:09:20 PM</span>
        </div>
        <div class="data-row">
            <span>Day Length</span>
            <span>14:37:41</span>
        </div>
    </div>
    
    <div class="card ">
        <h2>Similar Day</h2>
        
        <div class="data-row">
            <span>Date</span>
            <span>April 28, 2026</span>
        </div>

            <span>Sunrise</span>
            <span>5:43:20 AM</span>
        </div>
        <div class="data-row">
            <span>Sunset</span>
            <span>7:40:49 PM</span>
        </div>
        <div class="data-row">
            <span>Day Length</span>

        </div>
        
    </div>
</body>
</html>
