<!DOCTYPE html>
<html lang="en">
<head>
    <title>Daylight Comparison for Boston</title>
    <link rel="stylesheet" href="styles.css" type="text/css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    <h1>Daylight Comparison for Boston</h1>
    
    <div class="card">
        <h2>Today (September 18, 2026)</h2>
        <div class="data-row">
            <span>Sunrise</span>
            <span>6:27:13 AM</span>
        </div>
        <div class="data-row">
            <span>Sunset</span>
            <span>6:48:40 PM</span>
        </div>
        <div class="data-row">
            <span>Day Length</span>
            <span>12:21:26</span>
        </div>
    </div>
    
    <div class="card ">
        <h2>Similar Day</h2>
        
        <div class="data-row">
            <span>Date</span>
            <span>March 24, 2026</span>
        </div>
        <div class="data-row">
            <span>Sunrise</span>
            <span>6:40:18 AM</span>
        </div>
        <div class="data-row">
            <span>Sunset</span>
            <span>7:01:19 PM</span>
        </div>
        <div class="data-row">
            <span>Day Length</span>

        </div>
        
    </div>
</body>
</html>
