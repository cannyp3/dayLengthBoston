<!DOCTYPE html>
<html lang="en">
<head>
    <title>Daylight Comparison for Boston</title>
    <link rel="stylesheet" href="styles.css" type="text/css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    <h1>Daylight Comparison for Boston</h1>
    
    <div class="card">
        <h2>Today (October 20, 2026)</h2>
        <div class="data-row">
            <span>Sunrise</span>
            <span>7:02:51 AM</span>
        </div>
        <div class="data-row">
            <span>Sunset</span>
            <span>5:54:32 PM</span>
        </div>
        <div class="data-row">
            <span>Day Length</span>
            <span>10:51:40</span>
        </div>
    </div>
    
    <div class="card ">
        <h2>Similar Day</h2>
        
        <div class="data-row">
            <span>Date</span>
            <span>February 21, 2026</span>
        </div>
        <div class="data-row">
            <span>Sunrise</span>
            <span>6:31:44 AM</span>
        </div>
        <div class="data-row">
            <span>Sunset</span>
            <span>5:24:28 PM</span>
        </div>
        <div class="data-row">
            <span>Day Length</span>
            <span>10:52:43</span>
        </div>
        
    </div>
</body>
</html>
