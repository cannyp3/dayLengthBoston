<!DOCTYPE html>
<html lang="en">
<head>
    <title>Daylight Comparison for Boston</title>
    <link rel="stylesheet" href="styles.css" type="text/css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    <h1>Daylight Comparison for Boston</h1>
    
    <div class="card">
        <h2>Today (August 16, 2026)</h2>
        <div class="data-row">
            <span>Sunrise</span>
            <span>5:52:21 AM</span>
        </div>
        <div class="data-row">
            <span>Sunset</span>
            <span>7:43:54 PM</span>
        </div>
        <div class="data-row">
            <span>Day Length</span>
            <span>13:51:32</span>
        </div>
    </div>
    
    <div class="card ">

        <div class="data-row">

            <span>5:46:11 AM</span>
        </div>

    </div>
</body>
</html>
