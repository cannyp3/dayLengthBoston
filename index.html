<!DOCTYPE html>
<html lang="en">
<head>
    <title>Daylight Comparison for Boston</title>
    <link rel="stylesheet" href="styles.css" type="text/css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    <h1>Daylight Comparison for Boston</h1>
    
    <div class="card">
        <h2>Today (September 16, 2026)</h2>
        <div class="data-row">
            <span>Sunrise</span>
            <span>6:25:06 AM</span>
        </div>
        <div class="data-row">
            <span>Sunset</span>
            <span>6:52:12 PM</span>
        </div>
        <div class="data-row">
            <span>Day Length</span>
            <span>12:27:06</span>
        </div>
    </div>
    
    <div class="card ">
        <h2>Similar Day</h2>
        
        <div class="data-row">
            <span>Date</span>
            <span>March 26, 2026</span>
        </div>
        <div class="data-row">
            <span>Sunrise</span>
            <span>6:36:49 AM</span>
        </div>
        <div class="data-row">
            <span>Sunset</span>
            <span>7:03:36 PM</span>
        </div>
        <div class="data-row">
            <span>Day Length</span>
            <span>12:26:46</span>
        </div>
        
    </div>
</body>
</html>
