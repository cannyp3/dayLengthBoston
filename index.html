<!DOCTYPE html>
<html lang="en">
<head>
    <title>Daylight Comparison for Boston</title>
    <link rel="stylesheet" href="styles.css" type="text/css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    <h1>Daylight Comparison for Boston</h1>
    
    <div class="card">
        <h2>Today (October 02, 2026)</h2>
        <div class="data-row">
            <span>Sunrise</span>
            <span>6:42:18 AM</span>
        </div>
        <div class="data-row">
            <span>Sunset</span>
            <span>6:24:03 PM</span>
        </div>
        <div class="data-row">
            <span>Day Length</span>
            <span>11:41:45</span>
        </div>
    </div>
    
    <div class="card ">
        <h2>Similar Day</h2>
        
        <div class="data-row">
            <span>Date</span>
            <span>March 10, 2026</span>
        </div>
        <div class="data-row">
            <span>Sunrise</span>
            <span>7:04:25 AM</span>
        </div>
        <div class="data-row">
            <span>Sunset</span>
            <span>6:45:09 PM</span>
        </div>
        <div class="data-row">
            <span>Day Length</span>
            <span>11:40:43</span>
        </div>
        
    </div>
</body>
</html>
