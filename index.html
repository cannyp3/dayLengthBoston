<!DOCTYPE html>
<html lang="en">
<head>
    <title>Daylight Comparison for Boston</title>
    <link rel="stylesheet" href="styles.css" type="text/css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    <h1>Daylight Comparison for Boston</h1>
    
    <div class="card">
        <h2>Today (August 26, 2026)</h2>
        <div class="data-row">
            <span>Sunrise</span>
            <span>6:02:58 AM</span>
        </div>
        <div class="data-row">
            <span>Sunset</span>
            <span>7:28:18 PM</span>
        </div>
        <div class="data-row">
            <span>Day Length</span>
            <span>13:25:19</span>
        </div>
    </div>
    
    <div class="card ">
        <h2>Similar Day</h2>
        
        <div class="data-row">
            <span>Date</span>
            <span>April 16, 2026</span>
        </div>
        <div class="data-row">
            <span>Sunrise</span>
            <span>6:01:26 AM</span>
        </div>
        <div class="data-row">
            <span>Sunset</span>
            <span>7:27:18 PM</span>
        </div>
        <div class="data-row">
            <span>Day Length</span>
            <span>13:25:52</span>
        </div>
        
    </div>
</body>
</html>
