<!DOCTYPE html>
<html lang="en">
<head>
    <title>Daylight Comparison for Boston</title>
    <link rel="stylesheet" href="styles.css" type="text/css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    <h1>Daylight Comparison for Boston</h1>
    
    <div class="card">
        <h2>Today (October 11, 2026)</h2>
        <div class="data-row">
            <span>Sunrise</span>
            <span>6:52:22 AM</span>
        </div>
        <div class="data-row">
            <span>Sunset</span>
            <span>6:08:49 PM</span>
        </div>
        <div class="data-row">
            <span>Day Length</span>
            <span>11:16:27</span>
        </div>
    </div>
    
    <div class="card ">
        <h2>Similar Day</h2>
        
        <div class="data-row">
            <span>Date</span>
            <span>March 01, 2026</span>
        </div>
        <div class="data-row">
            <span>Sunrise</span>
            <span>6:19:18 AM</span>
        </div>
        <div class="data-row">
            <span>Sunset</span>
            <span>5:34:22 PM</span>
        </div>
        <div class="data-row">
            <span>Day Length</span>
            <span>11:15:03</span>
        </div>
        
    </div>
</body>
</html>
